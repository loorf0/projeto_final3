<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre na sua conta NexTech Informática.">
    <title>Entrar | NexTech Informática</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
    <div id="site-header"></div>

    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="assets/img/logo.svg" alt="NexTech Informática">
            </div>
            <h1>Bem-vindo de volta</h1>
            <p class="auth-sub">Entre para acompanhar seus pedidos e finalizar compras.</p>

            <div class="auth-erro" id="auth-erro" role="alert"></div>

            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                           placeholder="voce@email.com" required>
                </div>

                <div class="mb-2">
                    <label class="form-label" for="senha">Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="senha" name="senha"
                               autocomplete="current-password" placeholder="Sua senha" required>
                        <button class="btn" type="button" id="btn-ver-senha" aria-label="Mostrar senha">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="lembrar" checked>
                        <label class="form-check-label" for="lembrar" style="font-size:12px;color:var(--texto-muted)">
                            Manter conectado
                        </label>
                    </div>
                    <span class="texto-muted" style="font-size:11.5px">Sessão de 7 dias</span>
                </div>

                <button type="submit" class="btn-nextech" id="btn-entrar">
                    <i class="bi bi-box-arrow-in-right"></i> Entrar
                </button>
            </form>

            <p class="auth-link">Ainda não tem conta? <a href="cadastro.html">Criar conta gratuita</a></p>

            <div class="auth-divisor">acesso de demonstração</div>

            <div style="background:#f8fafc;border:1px solid var(--linha);border-radius:12px;padding:12px 14px;font-size:11.5px;color:var(--texto-soft)">
                <div><strong>Email:</strong> demo@nextech.com</div>
                <div><strong>Senha:</strong> demo1234</div>
                <button type="button" class="btn btn-link p-0 mt-1" id="btn-demo" style="font-size:11.5px;font-weight:800">
                    Preencher automaticamente
                </button>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
