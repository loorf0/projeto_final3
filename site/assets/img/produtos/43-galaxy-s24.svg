    <circle cx="120" cy="520" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    <g transform="rotate(-3 400 300)">
        
                <g transform="translate(400 300)">
                    <rect x="-95" y="-170" width="190" height="340" rx="30" fill="rgba(255,255,255,0.05)" stroke="#2dd4bf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="-72" y="-138" width="144" height="250" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.55)" stroke-width="6" stroke-linecap="round"/>
