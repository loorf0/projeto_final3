<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Montagem de PC + Teste de Estresse">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1026"/>
            <stop offset="1" stop-color="#2b1b6b"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="55%">
            <stop offset="0" stop-color="#a78bfa" stop-opacity=".28"/>
            <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
        </pattern>
    </defs>
    <rect width="800" height="600" fill="url(#bg)"/>
    <rect width="800" height="600" fill="url(#grid)"/>
    <circle cx="400" cy="300" r="270" fill="url(#glow)"/>
    <circle cx="680" cy="90" r="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
    <circle cx="120" cy="520" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    <g transform="rotate(-3 400 300)">
        
                <g transform="translate(400 300)">
                    <g transform="rotate(-35)">
                        <rect x="-15" y="-150" width="30" height="230" rx="10" fill="rgba(255,255,255,0.08)" stroke="#a78bfa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M-45 -165h90l-15 45h-60z" fill="#a78bfa" opacity=".8"/>
                    </g>
                    <g transform="rotate(35)">
                        <rect x="-12" y="-95" width="24" height="210" rx="8" fill="rgba(255,255,255,0.08)" stroke="#a78bfa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M-55 -135a45 45 0 1 1 110 0c0 20-10 35-28 42v20h-54v-20c-18-7-28-22-28-42z" fill="none" stroke="#a78bfa" stroke-width="9"/>
                    </g>
                </g>
    </g>
    <text x="40" y="560" fill="rgba(255,255,255,0.45)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">NEXTECH</text>
    <text x="760" y="560" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end" opacity=".8">SERVIÇOS</text>
</svg>
