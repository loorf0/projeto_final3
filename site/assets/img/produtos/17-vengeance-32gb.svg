                        <rect x="-135" y="-55" width="42" height="30" rx="5" fill="#22d3ee" opacity=".65"/><rect x="-70" y="-55" width="42" height="30" rx="5" fill="#22d3ee" opacity=".65"/><rect x="-5" y="-55" width="42" height="30" rx="5" fill="#22d3ee" opacity=".65"/><rect x="60" y="-55" width="42" height="30" rx="5" fill="#22d3ee" opacity=".65"/><rect x="125" y="-55" width="42" height="30" rx="5" fill="#22d3ee" opacity=".65"/>
