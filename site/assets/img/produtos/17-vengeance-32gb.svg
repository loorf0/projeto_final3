        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="55%">
            <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
            <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
